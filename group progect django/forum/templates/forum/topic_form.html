<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Створити тему | Форум групи</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f7fc;
            color: #1e293b;
        }

        .header {
            background: #ffffff;
            border-bottom: 1px solid #e2e8f0;
            padding: 22px 7%;
        }

        .logo {
            color: #2563eb;
            font-size: 23px;
            font-weight: bold;
        }

        .container {
            max-width: 700px;
            margin: 45px auto;
            padding: 0 20px;
        }

        .back {
            display: inline-block;
            color: #2563eb;
            text-decoration: none;
            margin-bottom: 22px;
        }

        .back:hover {
            text-decoration: underline;
        }

        .form-card {
            background: white;
            padding: 32px;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(15, 23, 42, 0.05);
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        form p {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
            color: #334155;
        }

        input[type="text"],
        textarea {
            display: block;
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 9px;
            background: #ffffff;
            color: #1e293b;
            font: inherit;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea {
            min-height: 180px;
            resize: vertical;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 26px;
        }

        button {
            border: none;
            border-radius: 9px;
            padding: 13px 21px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .cancel {
            color: #64748b;
            text-decoration: none;
        }

        .cancel:hover {
            color: #1e293b;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: #64748b;
            font-size: 13px;
        }

        .errorlist {
            color: #dc2626;
            padding-left: 20px;
        }

        @media (max-width: 600px) {
            .container {
                margin-top: 28px;
            }

            .form-card {
                padding: 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Форум групи</div>
    </header>

    <main class="container">
        <a class="back" href="{% url 'forum:home' %}">
            ← Назад до форуму
        </a>

        <section class="form-card">
            <h1>Створити тему</h1>
            <p class="subtitle">
                Поділися своєю думкою або розпочни нове обговорення.
            </p>

            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}

                <div class="actions">
                    <button type="submit">Опублікувати</button>
                    <a class="cancel" href="{% url 'forum:home' %}">
                        Скасувати
                    </a>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
