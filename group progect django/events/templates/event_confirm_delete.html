
{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Видалити подію</title>
    <link rel="stylesheet" href="{% static 'events/style.css' %}">
</head>
<body>

<header class="navbar">
    <span class="logo">Портал групи — Події</span>
    <nav>
        <a href="{% url 'events:events' %}">Події</a>
        <a href="{% url 'events:event_calendar' %}">Календар</a>
    </nav>
</header>

<main class="container">
    <div class="delete-card">
        <h1>Видалити подію?</h1>

        <p>
            Ти справді хочеш видалити
            <strong>{{ object.title }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="actions">
                <button class="btn btn-danger" type="submit">
                    Так, видалити
                </button>

                <a class="btn btn-secondary"
                   href="{% url 'events:event_detail' object.pk %}">
                    Скасувати
                </a>
            </div>
        </form>
    </div>
</main>

</body>
</html>
