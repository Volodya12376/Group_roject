{% load static %}
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Електронний журнал{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'students' %}">
            <i class="bi bi-journal-bookmark-fill me-2"></i>Електронний журнал
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link {% block students_active %}{% endblock %}" href="{% url 'students' %}">
                        <i class="bi bi-people me-1"></i>Учні
                    </a>
                </li>
            </ul>
            <span class="navbar-text text-white-50 me-3">
                <i class="bi bi-person-circle me-1"></i>{{ request.user.username }}
            </span>
        </div>
    </div>
</nav>

{% block hero %}{% endblock %}

<main class="container page-content">
    {% block content %}{% endblock %}
</main>

<footer class="site-footer">
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
